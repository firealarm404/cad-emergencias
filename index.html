header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:15px;letter-spacing:.04em}header b span{color:var(--ac)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:6px 11px;border-radius:6px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.dng{color:var(--rd)}
main{padding:16px;max-width:1300px;margin:auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:16px}h3{margin:0 0 8px;font-size:14px;color:var(--mu)}
input,select,textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kp div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px}.kp b{display:block;font-size:32px;line-height:1.1}.kp span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mu)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--bg);border:1px solid var(--bd)}
.Alta{background:var(--rd);color:#fff;border-color:var(--rd)}.Media{background:var(--ac);color:#fff;border-color:var(--ac)}.Baja{background:var(--ok);color:#fff;border-color:var(--ok)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{display:block;height:16px;background:var(--ac);border-radius:3px;min-width:2px}.bar em{width:150px;font-style:normal;font-size:12px}
svg.map{width:100%;height:auto;background:var(--mp);border-radius:8px;cursor:crosshair;display:block}
.pt{cursor:pointer}.pt text{font-size:11px;fill:var(--tx);pointer-events:none}
@keyframes pl{0%{r:8;opacity:1}100%{r:34;opacity:0}}.pul{animation:pl 1.4s infinite;fill:var(--rd)}
@keyframes bl{50%{opacity:.55}}
.res div{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;margin:4px 0;cursor:pointer}.res div:hover{border-color:var(--ac)}
.chk{display:flex;gap:6px;align-items:center;margin:3px 0;font-size:13px}.chk input{width:auto}
.ban{background:var(--rd);color:#fff;padding:18px;border-radius:10px;font-size:24px;font-weight:700;margin-bottom:14px;animation:bl 1s infinite}
.okb{background:var(--ok);color:#fff;padding:18px;border-radius:10px;font-size:24px;font-weight:700;margin-bottom:14px}
.wb .kp b{font-size:54px}.wb .ev{font-size:18px}
.ov{position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:12px}.md{background:var(--sf);border:3px solid var(--rd);border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow:auto}.md h2{background:var(--rd);color:#fff;margin:0;padding:12px 14px}svg.map.sat{background:#44503a}.sat ellipse{fill:#6b5a43!important}.sat path{stroke:#c9bd9c!important}.sat .pt text{fill:#fff;stroke:#000;stroke-width:2px;paint-order:stroke}.leaflet-container{z-index:0;font:inherit}.pp{color:#161b22;font-size:13px;max-height:230px;overflow:auto;min-width:160px}.pp .mu{color:#5d6676;font-size:12px}.lpulse{width:18px;height:18px;border-radius:50%;background:#c92a2a;border:2px solid #fff;animation:lp 1.4s infinite}@keyframes lp{0%{box-shadow:0 0 0 0 #c92a2aaa}100%{box-shadow:0 0 0 26px #c92a2a00}}.lbase{width:14px;height:14px;background:#2b8a3e;border:2px solid #fff;box-shadow:0 0 3px #000}.uic{font-size:24px;line-height:1;text-align:center;filter:drop-shadow(0 0 3px #000)}body.ro nav,body.ro header button{display:none}@media print{header,.noprint,button,input,select{display:none!important}body{background:#fff}.card{break-inside:avoid}}#wx{position:fixed;left:12px;bottom:12px;z-index:40;display:flex;flex-direction:column-reverse;align-items:flex-start;max-width:min(94vw,400px)}.wxb{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:12.5px;box-shadow:0 2px 10px #0003}.wxp{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px;box-shadow:0 6px 24px #0004;width:100%}.wxh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.wxh button{padding:2px 8px}.wxp table{font-size:12px}.wxp th,.wxp td{padding:3px 6px}@media print{#wx{display:none}}.login{max-width:340px;margin:12vh auto}.mu{color:var(--mu);font-size:12px}
@media(max-width:800px){.g2{grid-template-columns:1fr}}

const hx=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
function k2t(d){if(!d)return'';let s=/&lt;/.test(d)?hx(d):d;s=s.replace(/<br\s*\/?>|<\/div>|<\/p>|<\/li>/gi,'\n').replace(/<[^>]+>/g,'');return hx(s).replace(/\u00a0/g,' ').split('\n').map(x=>x.trim()).filter(Boolean).join('\n')}
function parseKml(txt){const doc=new DOMParser().parseFromString(txt,'text/xml'),q=(e,t)=>[...e.getElementsByTagNameNS('*',t)],styles={};
q(doc,'*').forEach(e=>{const a=[...e.attributes].find(a=>a.name=='id'||a.name.endsWith(':id'));if(!a)return;const ls=q(e,'LineStyle')[0];if(ls){const c=q(ls,'color')[0],w=q(ls,'width')[0];styles[a.value]={c:c&&c.textContent.trim(),w:w?+w.textContent:3}}});
const col=(c,d)=>c&&c.length==8?'#'+c.slice(6,8)+c.slice(4,6)+c.slice(2,4):d,out={points:[],lines:[],polys:[]};
const cc=e=>{const x=q(e,'coordinates')[0];return x?x.textContent.trim().split(/\s+/).map(t=>t.split(',').map(Number)).filter(a=>a.length>=2&&!isNaN(a[0])&&!isNaN(a[1])).map(a=>[+a[1].toFixed(5),+a[0].toFixed(5)]):[]};
const ch=(e,t)=>[...e.children].find(c=>c.localName==t),tx=(e,t)=>{const c=ch(e,t);return c?c.textContent:''};
const walk=(n,path)=>[...n.children].forEach(c=>{
if(c.localName=='Folder'){const nm=tx(c,'name').trim();walk(c,path.length&&path[path.length-1]==nm?path:[...path,nm])}
else if(c.localName=='Placemark'){const nm=tx(c,'name').trim()||'Sin nombre',d=k2t(tx(c,'description')),f=path.join(' / '),su=tx(c,'styleUrl').replace('#',''),st=styles[su+'_normal']||styles[su]||{};
q(c,'Point').forEach(p=>{const a=cc(p);if(a.length)out.points.push({n:nm,d,f,lat:a[0][0],lon:a[0][1]})});
q(c,'LineString').forEach(l=>{const a=cc(l);if(a.length>1)out.lines.push({n:nm,d,f,c:col(st.c,'#fbc02d'),w:Math.min(st.w||3,5),pts:a})});
q(c,'Polygon').forEach(g=>{const o=q(g,'outerBoundaryIs')[0],a=o?cc(o):[];if(a.length>2)out.polys.push({n:nm,d,f,c:col(st.c,'#1976d2'),pts:a})})}});
walk(q(doc,'Document')[0]||doc.documentElement,[]);return out}
function applyGeo(g,quiet){const P=g.points;if(!P.length)return;const a=P.map(p=>p.lon),b=P.map(p=>p.lat),x0=Math.min(...a),x1=Math.max(...a),y0=Math.min(...b),y1=Math.max(...b);
S.points=P.map((p,i)=>({id:'k'+i,n:p.n,d:p.d,f:p.f,lat:p.lat,lon:p.lon,x:Math.round(60+(x1==x0?.5:(p.lon-x0)/(x1-x0))*880),y:Math.round(540-(y1==y0?.5:(p.lat-y0)/(y1-y0))*480)}));
S.lines=g.lines.map((l,i)=>({id:'l'+i,...l}));S.polys=g.polys.map((l,i)=>({id:'g'+i,...l}));
const br=S.points.filter(p=>/brigada/i.test(p.f));if(br.length){S.bases=br.map((p,i)=>({id:'b'+i,n:p.n,x:p.x,y:p.y,lat:p.lat,lon:p.lon}));S.units.forEach((u,i)=>{if(!S.bases.some(x=>x.n==u.base))u.base=S.bases[i%S.bases.length].n})}
S.points.filter(p=>/policl/i.test(p.f)).forEach(p=>{if(!S.centros.some(c=>c.n==p.n))S.centros.push({id:uid(),n:p.n,t:'Interno'})});

function pDate(v){if(v instanceof Date&&!isNaN(v))return new Date(v.getFullYear(),v.getMonth(),v.getDate());if(typeof v=='number'&&v>20000){const d=new Date(Math.floor(v-25569)*864e5);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}const s=String(v).trim();let m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1])}m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);return m?new Date(+m[1],+m[2]-1,+m[3]):null}
