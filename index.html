<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Emergencias - Despacho</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div id="login-screen" class="overlay">
        <div class="login-box">
            <h2>CAD EMERGENCIAS</h2>
            <input type="email" id="email" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="login()">INGRESAR</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <header>
            <div class="brand"><strong>CAD</strong> | MONITOREO Y DESPACHO</div>
            <div class="header-controls">
                <button class="btn-logout" onclick="logout()">Salir</button>
            </div>
        </header>

        <div class="container">
            <aside id="sidebar">
                <div class="section-title">MATERIAL MAYOR</div>
                <div id="lista-vehiculos"></div>
            </aside>
            <div id="map"></div>
        </div>
        
        <button id="btn-nueva-emergencia" onclick="abrirModalEmergencia()">+</button>
    </div>

    <div id="modal-claves" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-titulo">Unidad</h3>
                <button onclick="cerrarModal()" class="btn-close">&times;</button>
            </div>
            <div id="view-claves" class="claves-grid"></div>
            <div id="view-bases" style="display:none;">
                <div class="claves-grid" id="bases-container"></div>
                <button onclick="mostrarClavesPrincipales()" class="btn-back">VOLVER</button>
            </div>
            <div id="view-tramite" style="display:none;">
                <input type="text" id="input-613" placeholder="Detalle del trámite...">
                <button onclick="guardarTramite()" class="btn-clave" style="background:var(--accent); margin-top:10px; width:100%;">GUARDAR</button>
                <button onclick="mostrarClavesPrincipales()" class="btn-back">VOLVER</button>
            </div>
        </div>
    </div>

    <div id="modal-emergencia" class="modal-overlay transparent-bg" style="display:none;">
        <div class="modal-content float-form">
            <div class="modal-header">
                <h3>NUEVA EMERGENCIA</h3>
                <button onclick="cerrarModalEmergencia()" class="btn-close">&times;</button>
            </div>
            <div class="form-emergencia">
                <label>TIPO DE EMERGENCIA</label>
                <select id="em-tipo">
                    <optgroup label="🔥 INCENDIO">
                        <option value="Amago equipos mineros">Amago incendio equipos mineros</option>
                        <option value="Incendio Forestal">Incendio Forestal</option>
                        <option value="Pastizales/Basura">Pastizales y/o Basura</option>
                        <option value="Incendio instalaciones">Incendio instalaciones</option>
                    </optgroup>
                    <optgroup label="🚔 VEHICULAR">
                        <option value="Choque livianos">Choque vehículos livianos</option>
                        <option value="Colisión Pesados">Colisión vehículos pesados</option>
                        <option value="Volcamiento">Volcamiento</option>
                        <option value="Desbarrancamiento">Desbarrancamiento</option>
                    </optgroup>
                    <optgroup label="🩺 MEDICO">
                        <option value="PCR">PCR</option>
                        <option value="Fractura">Fractura</option>
                        <option value="Desmayo">Desmayo / Inconsciente</option>
                        <option value="Crisis Panico">Crisis de Pánico</option>
                    </optgroup>
                    <optgroup label="🪜 RESCATE">
                        <option value="Atrapamiento">Atrapamiento</option>
                        <option value="Rescate vertical">Rescate vertical</option>
                        <option value="Espacio confinado">Rescate espacio confinado</option>
                    </optgroup>
                    <optgroup label="☢️ HAZMAT">
                        <option value="Derrame">Derrame de sustancias</option>
                        <option value="Fuga">Fuga de sustancias/gases</option>
                    </optgroup>
                    <optgroup label="⚙️ OTROS">
                        <option value="Activacion SPCI">Activación alarma SPCI</option>
                        <option value="Rescate animal">Rescate animal</option>
                        <option value="Sismo">Sismo / Terremoto</option>
                        <option value="Meteorologico">Evento Meteorológico</option>
                    </optgroup>
                </select>
                
                <label>UBICACIÓN (Haz clic en mapa o busca)</label>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="em-direccion" placeholder="Calle, ciudad o coordenadas">
                    <button onclick="buscarDireccion()" type="button" class="btn-search">🔍</button>
                </div>

                <label>NOTAS ADICIONALES</label>
                <textarea id="em-notas" rows="2" placeholder="Detalles de la emergencia..."></textarea>
                
                <button onclick="crearEmergencia()" class="btn-despacho">GENERAR DESPACHO</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>/html>
