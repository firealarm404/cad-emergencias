<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Emergencias - Sistema de Despacho</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div id="login-screen" class="overlay">
        <div class="login-box">
            <h2>CAD EMERGENCIAS</h2>
            <input type="email" id="email" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="login()">INGRESAR</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <header>
            <div class="brand"><strong>CAD</strong> | MONITOREO Y DESPACHO</div>
            <div class="header-controls">
                <button id="theme-toggle" onclick="toggleTheme()">Modo Claro</button>
                <button class="btn-logout" onclick="logout()">Salir</button>
            </div>
        </header>

        <div class="container">
            <aside id="sidebar">
                <div class="section-title">MATERIAL MAYOR</div>
                <div id="lista-vehiculos"></div>
            </aside>
            <div id="map"></div>
        </div>
        
        <button id="btn-nueva-emergencia" onclick="abrirModalEmergencia()">+</button>
    </div>

    <div id="modal-claves" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-titulo">Unidad</h3>
                <button onclick="cerrarModal()" class="btn-close">&times;</button>
            </div>
            <div id="view-claves" class="claves-grid"></div>
            <div id="view-bases" style="display:none;">
                <div class="claves-grid" id="bases-container"></div>
                <button onclick="mostrarClavesPrincipales()" class="btn-back">VOLVER</button>
            </div>
            <div id="view-tramite" style="display:none;">
                <input type="text" id="input-613" placeholder="Detalle del trámite...">
                <button onclick="guardarTramite()" class="btn-clave" style="background:var(--accent); margin-top:10px;">GUARDAR</button>
                <button onclick="mostrarClavesPrincipales()" class="btn-back">VOLVER</button>
            </div>
        </div>
    </div>

    <div id="modal-emergencia" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width:500px;">
            <div class="modal-header">
                <h3>NUEVA EMERGENCIA</h3>
                <button onclick="cerrarModalEmergencia()" class="btn-close">&times;</button>
            </div>
            <div class="form-emergencia">
                <label>TIPO DE EMERGENCIA</label>
                <select id="em-tipo">
                    <option value="10-0 Incendio">10-0 Incendio</option>
                    <option value="10-4 Accidente Vehicular">10-4 Accidente Vehicular</option>
                    <option value="10-3 Emergencia Médica">10-3 Emergencia Médica</option>
                    <option value="10-6 Rescate">10-6 Rescate</option>
                </select>
                <label>UBICACIÓN (Clic en mapa o coordenadas)</label>
                <input type="text" id="em-direccion" placeholder="Ej: -33.123, -70.456">
                <label>NOTAS ADICIONALES (Teléfono, numeración, etc)</label>
                <textarea id="em-notas" rows="3" placeholder="Detalles de quien llama..."></textarea>
                <button onclick="crearEmergencia()" class="btn-despacho">GENERAR DESPACHO</button>
            </div>
        </div>
    </div>

    <div id="modal-gestion" class="modal-overlay" style="display:none;">
        <div class="modal-content" style="max-width:800px; border-top: 5px solid var(--rojo);">
            <div class="modal-header">
                <h3 id="gest-titulo">EMERGENCIA</h3>
                <button onclick="cerrarGestion()" class="btn-close">&times;</button>
            </div>
            <div class="gestion-container">
                <div class="gest-info">
                    <p><strong>INICIO:</strong> <span id="gest-hora">00:00</span></p>
                    <p><strong>TIEMPO:</strong> <span id="gest-cronometro" style="color:var(--rojo); font-weight:bold;">00:00:00</span></p>
                    <p><strong>LUGAR:</strong> <span id="gest-lugar">---</span></p>
                </div>
                <div class="gest-unidades">
                    <h4>SUGERENCIAS (CERCANÍA)</h4>
                    <div id="sugerencias-lista"></div>
                    <hr>
                    <h4>UNIDADES EN DESPACHO</h4>
                    <div id="asignadas-lista"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
