<style>
:root{--bg:#eef0f3;--sf:#fff;--tx:#161b22;--mu:#5d6676;--bd:#d6dae1;--ac:#e8590c;--ok:#2b8a3e;--rd:#c92a2a;--mp:#e4e0d5;--pit:#cfc8b6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1218;--sf:#171d26;--tx:#e8ebf0;--mu:#8f9aab;--bd:#2a3340;--mp:#1b222c;--pit:#252d39;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1218;--sf:#171d26;--tx:#e8ebf0;--mu:#8f9aab;--bd:#2a3340;--mp:#1b222c;--pit:#252d39;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:15px;letter-spacing:.04em}header b span{color:var(--ac)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:6px 11px;border-radius:6px}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.dng{color:var(--rd)}
main{padding:16px;max-width:1300px;margin:auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:16px}h3{margin:0 0 8px;font-size:14px;color:var(--mu)}
input,select,textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:120px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kp div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px}.kp b{display:block;font-size:32px;line-height:1.1}.kp span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mu)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--bg);border:1px solid var(--bd)}
.Alta{background:var(--rd);color:#fff;border-color:var(--rd)}.Media{background:var(--ac);color:#fff;border-color:var(--ac)}.Baja{background:var(--ok);color:#fff;border-color:var(--ok)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{display:block;height:16px;background:var(--ac);border-radius:3px;min-width:2px}.bar em{width:150px;font-style:normal;font-size:12px}
svg.map{width:100%;height:auto;background:var(--mp);border-radius:8px;cursor:crosshair;display:block}
.pt{cursor:pointer}.pt text{font-size:11px;fill:var(--tx);pointer-events:none}
@keyframes pl{0%{r:8;opacity:1}100%{r:34;opacity:0}}.pul{animation:pl 1.4s infinite;fill:var(--rd)}
@keyframes bl{50%{opacity:.55}}
.res div{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;margin:4px 0;cursor:pointer}.res div:hover{border-color:var(--ac)}
.chk{display:flex;gap:6px;align-items:center;margin:3px 0;font-size:13px}.chk input{width:auto}

const RN={operador:'Operador',admin:'Administrador',super:'Superadministrador'};
function seed(){return{seq:0,
users:[{u:'super',p:'super123',n:'Superadmin',r:'super'},{u:'admin',p:'admin123',n:'Administrador',r:'admin'},{u:'op',p:'op123',n:'Operador 1',r:'operador'}],

units:[{id:uid(),n:'Ambulancia 01',t:'Ambulancia',base:'Base Emergencias Norte',cap:'2 pacientes + 2 paramédicos',mat:'DEA, oxígeno, camilla, kit trauma',st:'Disponible'},{id:uid(),n:'Carro Bomba 01',t:'Bomba',base:'Base Emergencias Norte',cap:'4 bomberos, 3000 L agua',mat:'Espuma AFFF, mangueras, ERA x4',st:'Disponible'},{id:uid(),n:'Rescate 01',t:'Rescate',base:'Base Emergencias Sur',cap:'6 rescatistas',mat:'Cuerdas, trípode, hidráulico, ERA',st:'Disponible'},{id:uid(),n:'Hazmat 01',t:'Materiales peligrosos',base:'Base Emergencias Sur',cap:'4 técnicos',mat:'Kits de contención, absorbentes, trajes nivel A',st:'Disponible'}],
em:[],log:[]}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S=seed();S.tr=S.tr||[];S.partes=S.partes||{};S.atc=S.atc||[['A-1','Primeros auxilios'],['A-2','Control de hemorragia'],['A-3','Inmovilización'],['A-4','RCP / DEA'],['A-5','Oxigenoterapia']].map(a=>({id:uid(),c:a[0],n:a[1]}));S.pue=S.pue||[{id:uid(),n:'PUE 1 (ejemplo)',d:'Descripción de ejemplo. El superadministrador puede editarla.'}];S.centros=S.centros||[['Policlínico de faena','Interno'],['Hospital regional','Externo'],['Clínica mutualidad','Externo']].map(a=>({id:uid(),n:a[0],t:a[1]}))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(window.cloudSave)window.cloudSave(S)}
function log(m){S.log.unshift({t:Date.now(),u:me?me.n:'-',m});save()}
const act=()=>S.em.filter(e=>e.st=='Activa');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){clearInterval(timer);const a=$('#app');
if(!me){a.innerHTML=`<div class="login card"><img src="${LOGO}" alt="CÓNDOR" style="width:100%;max-width:260px;display:block;margin:0 auto 6px"><p class="mu" style="text-align:center;margin:0 0 6px">Sistema CAD de emergencias mineras</p><label>Usuario</label><input id="lu"><label>Contraseña</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()"><p><button class="pri" onclick="login()" style="width:100%">Ingresar</button></p><p class="mu" id="le">Demo: super/super123 · admin/admin123 · op/op123</p></div>`;return}
const m=MENU[me.r];if(!m.includes(view))view=m[0];
a.innerHTML=`<header><img src="${LOGO}" alt="CÓNDOR" style="height:46px;width:auto"><b style="font-size:11px;line-height:1.2;color:var(--mu);font-weight:500;letter-spacing:.06em">SISTEMA CAD<br>DE EMERGENCIAS</b><nav>${m.map(k=>`<button class="${k==view?'on':''}" onclick="go('${k}')">${LAB[k]}</button>`).join('')}</nav><span class="mu">${esc(me.n)} · ${RN[me.r]}</span><button onclick="me=null;render()">Salir</button></header><main class="${view=='wallboard'?'wb':''}">${V[view]()}</main>`;
if(view=='wallboard'){let c=0;timer=setInterval(()=>{if(++c>=5){load();render();return}const e=$('#tsd');if(e)e.textContent=tsd()},1000)}}

function login(){const u=S.users.find(x=>x.u==$('#lu').value.trim()&&x.p==$('#lp').value);if(!u){$('#le').textContent='Credenciales inválidas';return}me=u;view='';log('Inicio de sesión');render()}
function mapSvg(click){const ps=S.points.map(p=>`<g class="pt" data-p="${p.id}"><circle cx="${p.x}" cy="${p.y}" r="6" fill="#1971c2" stroke="#fff" stroke-width="1.5"/><text x="${p.x+9}" y="${p.y+4}">${esc(p.n)}</text></g>`).join('');
const bs=S.bases.map(b=>`<g class="pt"><rect x="${b.x-7}" y="${b.y-7}" width="14" height="14" fill="#2b8a3e" stroke="#fff" stroke-width="1.5"/><text x="${b.x+10}" y="${b.y+4}">${esc(b.n)}</text></g>`).join('');
const es=act().map(e=>`<circle class="pul" cx="${e.loc.x}" cy="${e.loc.y}" r="8"/><circle cx="${e.loc.x}" cy="${e.loc.y}" r="7" fill="#c92a2a" stroke="#fff" stroke-width="2"/><text x="${e.loc.x+11}" y="${e.loc.y-8}" style="font-size:12px;font-weight:700;fill:var(--rd)">#${e.n} ${esc(e.type)}</text>`).join('');
const sel=D.loc&&click?`<path d="M${D.loc.x-12} ${D.loc.y}h24M${D.loc.x} ${D.loc.y-12}v24" stroke="#e8590c" stroke-width="3"/><circle cx="${D.loc.x}" cy="${D.loc.y}" r="14" fill="none" stroke="#e8590c" stroke-width="2"/>`:'';
return`<svg class="map ${LAY=='sat'?'sat':''}" viewBox="0 0 1000 600" ${click?'onclick="mapClick(event)"':''}><ellipse cx="290" cy="280" rx="190" ry="150" fill="var(--pit)"/><ellipse cx="290" cy="280" rx="120" ry="90" fill="var(--mp)" opacity=".6"/><path d="M60 60L250 150L520 210L700 160L900 90M250 150L330 400L620 390L880 500M520 210L840 300L880 500M130 470L330 400" stroke="#8a8372" stroke-width="5" fill="none" opacity=".55"/>${ps}${bs}${es}${sel}</svg>`}
function mapClick(ev){const sv=ev.currentTarget,pt=sv.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(sv.getScreenCTM().inverse()),g=ev.target.closest('[data-p]');
if(g){const p=S.points.find(x=>x.id==g.dataset.p);D.loc={x:p.x,y:p.y,n:p.n}}else{const x=Math.round(q.x),y=Math.round(q.y);D.loc={x,y,n:`Punto libre (${x}, ${y})`}}D.open=1;render()}
function resHtml(){const q=D.q.toLowerCase();if(!q)return'';const r=S.points.filter(p=>p.n.toLowerCase().includes(q)).slice(0,6);return r.length?r.map(p=>`<div onclick="pick('${p.id}')">${esc(p.n)}</div>`).join(''):'<span class="mu">Sin resultados</span>'}

function dispatch(){if(!D.loc)return alert('Seleccione una ubicación en el plano o con la búsqueda');if(!D.type)return alert('Seleccione el tipo de emergencia');
const e={id:uid(),n:++S.seq,loc:D.loc,type:D.type,sub:D.sub,pri:D.pri,desc:D.desc,units:D.units,t:Date.now(),st:'Activa',by:me.n};
S.em.unshift(e);S.units.forEach(u=>{if(D.units.includes(u.id)){u.st='Despachada';u.k='';u.det='Hacia '+D.loc.n}});
log(`DESPACHO #${e.n}: ${e.type}${e.sub?' / '+e.sub:''} (${e.pri}) en ${e.loc.n}. Unidades: ${e.units.map(i=>S.units.find(u=>u.id==i)?.n).join(', ')||'ninguna'}`);
D={q:'',loc:null,type:'',sub:'',pri:'Media',desc:'',units:[]};render()}
function closeEm(id){const e=S.em.find(x=>x.id==id);e.st='Cerrada';e.tc=Date.now();S.units.forEach(u=>{if(e.units.includes(u.id)&&u.k!='0-8')u.st='Disponible'});log(`CIERRE #${e.n}: ${e.type} en ${e.loc.n}`);render()}
function emTable(){const a=act();return a.length?`<div class="tw"><table><tr><th>#</th><th>Emergencia</th><th>Ubicación</th><th>Prio.</th><th>Hora</th><th></th></tr>${a.map(e=>`<tr><td>${e.n}</td><td>${esc(e.type)}<br><span class="mu">${esc(e.sub)}</span></td><td>${esc(e.loc.n)}</td><td><span class="tag ${e.pri}">${e.pri}</span></td><td>${fmt(e.t)}</td><td><button onclick="closeEm('${e.id}')">Cerrar</button></td></tr>`).join('')}</table></div>`:'<p class="mu">Sin emergencias activas.</p>'}
function bars(o){const m=Math.max(1,...Object.values(o));const k=Object.keys(o);return k.length?k.map(x=>`<div class="bar"><em>${esc(x)}</em><i style="width:${o[x]/m*60}%"></i><b>${o[x]}</b></div>`).join(''):'<p class="mu">Sin datos</p>'}
function cnt(f){const o={};S.em.forEach(e=>{const k=f(e);o[k]=(o[k]||0)+1});return o}
function stats(){const c=S.em.filter(e=>e.tc),avg=c.length?Math.round(c.reduce((s,e)=>s+(e.tc-e.t),0)/c.length/60000):0,d=new Date().toDateString();
return{tot:S.em.length,act:act().length,hoy:S.em.filter(e=>new Date(e.t).toDateString()==d).length,avg,ud:S.units.filter(u=>u.st=='Disponible').length,ut:S.units.length,tipo:cnt(e=>e.type),pri:cnt(e=>e.pri),est:cnt(e=>e.st)}}
const IND={Alta:'Notificar a Jefatura de Turno y activar Plan de Emergencia. Despejar vías de acceso.',Media:'Mantener comunicación con unidades y reportar cada 10 min.',Baja:'Registrar y hacer seguimiento hasta el cierre.'};
const V={
despacho(){const t=S.types.find(x=>x.n==D.type),av=S.units.filter(u=>u.st=='Disponible');
return`<div class="g2"><div class="card"><h2>Plano de operaciones</h2><div class="row" style="margin-bottom:8px"><div><input placeholder="Buscar ubicación (ej: Chancado)" value="${esc(D.q)}" oninput="srch(this.value)"><div id="res" class="res">${resHtml()}</div></div></div>${mapSvg(1)}<p class="mu">Clic en el plano para ubicar la emergencia, o busque un punto registrado. Azul: puntos · Verde: bases · Rojo: emergencia.</p></div>
<div><div class="card"><h2>Despachar emergencia</h2><label>Ubicación</label><input readonly value="${esc(D.loc?D.loc.n:'(sin seleccionar)')}"><label>Tipo</label><select onchange="D.type=this.value;D.sub='';render()"><option value="">Seleccione…</option>${S.types.map(x=>`<option ${x.n==D.type?'selected':''}>${esc(x.n)}</option>`).join('')}</select><label>Subtipo</label><select onchange="D.sub=this.value"><option value="">—</option>${(t?t.s:[]).map(s=>`<option ${s==D.sub?'selected':''}>${esc(s)}</option>`).join('')}</select><label>Prioridad</label><select onchange="D.pri=this.value">${['Alta','Media','Baja'].map(p=>`<option ${p==D.pri?'selected':''}>${p}</option>`).join('')}</select><label>Unidades disponibles</label>${av.map(u=>`<div class="chk"><input type="checkbox" ${D.units.includes(u.id)?'checked':''} onchange="tg('${u.id}')"> ${esc(u.n)} <span class="mu">${esc(u.base)}</span></div>`).join('')||'<span class="mu">Sin unidades libres</span>'}<label>Descripción</label><textarea rows="3" oninput="D.desc=this.value">${esc(D.desc)}</textarea><p><button class="pri" style="width:100%" onclick="dispatch()">DESPACHAR</button></p></div>
<div class="card"><h2>Activas</h2>${emTable()}</div></div></div>`},
panel(){const s=stats();return`<div class="kp"><div><b>${s.act}</b><span>Activas</span></div><div><b>${s.tot}</b><span>Total registradas</span></div><div><b>${s.avg} min</b><span>Tiempo medio de cierre</span></div><div><b>${s.ud}/${s.ut}</b><span>Unidades disponibles</span></div></div><div class="g2" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Por tipo</h2>${bars(s.tipo)}</div><div class="card"><h2>Por prioridad</h2>${bars(s.pri)}<h2 style="margin-top:16px">Por estado</h2>${bars(s.est)}</div></div>`},
wallboard(){const a=act(),s=stats();return`${a.length?`<div class="ban">⚠ EMERGENCIA ACTIVA (${a.length})</div>`:'<div class="okb">✔ SIN EMERGENCIAS ACTIVAS</div>'}<div class="kp"><div><b>${s.act}</b><span>Activas</span></div><div><b>${s.hoy}</b><span>Hoy</span></div><div><b>${s.ud}/${s.ut}</b><span>Unidades disponibles</span></div><div><b>${s.avg} min</b><span>Cierre promedio</span></div></div><div class="g2"><div class="card">${mapSvg(0)}</div><div>${a.map(e=>`<div class="card ev"><span class="tag ${e.pri}">${e.pri}</span> <b>#${e.n} ${esc(e.type)}</b> ${esc(e.sub)}<br>${esc(e.loc.n)} · ${fmt(e.t)}<br><span class="mu">Unidades: ${e.units.map(i=>esc(S.units.find(u=>u.id==i)?.n)).join(', ')||'—'}</span><br><b>Indicación:</b> ${IND[e.pri]}</div>`).join('')||'<div class="card mu">Operación normal. Se actualiza cada 5 s.</div>'}</div></div>`},
bitacora(){return`<div class="card"><h2>Bitácora operacional</h2><div class="row"><input id="bn" placeholder="Nueva anotación manual"><button class="pri" style="flex:0" onclick="addLog()">Agregar</button></div></div><div class="card tw"><table><tr><th>Fecha</th><th>Usuario</th><th>Registro</th></tr>${S.log.slice(0,300).map(l=>`<tr><td>${fmt(l.t)}</td><td>${esc(l.u)}</td><td>${esc(l.m)}</td></tr>`).join('')}</table></div>`},
unidades(){return`<div class="card"><h2>Agregar unidad</h2><div class="row"><div><label>Nombre</label><input id="un"></div><div><label>Tipo</label><input id="ut" placeholder="Ambulancia, Bomba…"></div><div><label>Base</label><select id="ub">${S.bases.map(b=>`<option>${esc(b.n)}</option>`).join('')}</select></div><div><label>Capacidad</label><input id="uc"></div><div><label>Material que lleva</label><input id="um"></div><button class="pri" style="flex:0" onclick="addUnit()">Agregar</button></div></div><div class="card tw"><h2>Unidades</h2><table><tr><th>Unidad</th><th>Base</th><th>Capacidad</th><th>Material</th><th>Estado</th><th></th></tr>${S.units.map(u=>`<tr><td><b>${esc(u.n)}</b><br><span class="mu">${esc(u.t)}</span></td><td>${esc(u.base)}</td><td>${esc(u.cap)}</td><td>${esc(u.mat)}</td><td><span class="tag">${u.st}</span></td><td><button class="dng" onclick="del('units','${u.id}')">Eliminar</button></td></tr>`).join('')}</table></div>`},
bases(){return`<div class="card"><h2>Agregar base</h2><div class="row"><div><label>Nombre</label><input id="bn"></div><div><label>Ubicación (punto del plano)</label><select id="bp">${S.points.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select></div><button class="pri" style="flex:0" onclick="addBase()">Agregar</button></div></div><div class="card tw"><table><tr><th>Base</th><th>Unidades</th><th></th></tr>${S.bases.map(b=>`<tr><td>${esc(b.n)}</td><td>${S.units.filter(u=>u.base==b.n).length}</td><td><button class="dng" onclick="del('bases','${b.id}')">Eliminar</button></td></tr>`).join('')}</table></div>
<div class="card"><h2>Importar puntos desde Google Earth (KML/KMZ)</h2><input type="file" accept=".kml,.kmz" onchange="impKml(this.files[0])"><p class="mu">Reemplaza los puntos del plano por los Placemarks del archivo, ajustados al plano.</p></div>`},

tipos(){return`<div class="card"><h2>Agregar tipo</h2><div class="row"><div><label>Tipo</label><input id="tn"></div><div><label>Subtipos (separados por coma)</label><input id="ts"></div><button class="pri" style="flex:0" onclick="addType()">Agregar</button></div></div><div class="card tw"><table><tr><th>Tipo</th><th>Subtipos</th><th></th></tr>${S.types.map((t,i)=>`<tr><td><b>${esc(t.n)}</b></td><td>${t.s.map((s,j)=>`<span class="tag">${esc(s)} <a href="#" onclick="event.preventDefault();delSub(${i},${j})">✕</a></span> `).join('')}<br><input id="ns${i}" placeholder="Nuevo subtipo" style="width:180px;margin-top:6px"> <button onclick="addSub(${i})">+</button></td><td><button class="dng" onclick="delType(${i})">Eliminar</button></td></tr>`).join('')}</table></div>`},

const CL={'6-3':'En el lugar','6-7':'Situación controlada','6-8':'Disponible','6-9':'Se retira','6-10':'En base','6-11':'En panne','6-12':'Sufre colisión','6-13':'Otros trámites','6-14':'Servicentro','6-15':'Se dirige a centro asistencial','6-18':'Ingresa a túnel','6-19':'Sale del túnel'};
const tm=t=>new Date(t).toLocaleTimeString('es-CL'),hms=ms=>{ms=Math.max(0,ms);return[Math.floor(ms/3600000),Math.floor(ms%3600000/60000),Math.floor(ms%60000/1000)].map(x=>String(x).padStart(2,'0')).join(':')};
const scol=s=>s=='Disponible'?'#2b8a3e':/panne|colisi/.test(s)?'#c92a2a':'#e8590c';

function clave(id,c){if(!c)return;const q=S.units.find(x=>x.id==id);if(q&&q.k=='0-8')return alert('Unidad fuera de servicio (0-8). Póngala en servicio (0-9) en la vista Unidades.');if(c=='6-10'||c=='6-15'){D.pend={id,c};render();return}setK(S.units.find(x=>x.id==id),c,'')}

function addUnit(){const n=$('#un').value.trim();if(!n)return;S.units.push({id:uid(),n,t:$('#ut').value,base:$('#ub').value,cap:$('#uc').value,mat:$('#um').value,st:'Disponible'});log('Unidad agregada: '+n);render()}
function addBase(){const n=$('#bn').value.trim(),p=S.points.find(x=>x.id==$('#bp').value);if(!n||!p)return;S.bases.push({id:uid(),n,x:p.x,y:p.y});log('Base agregada: '+n);render()}
function addUser(){const u=$('#xu').value.trim();if(!u||S.users.some(x=>x.u==u))return;S.users.push({u,n:$('#xn').value||u,p:$('#xp').value,email:$('#xe').value.trim(),r:$('#xr').value});log('Usuario agregado: '+u);render()}
function delUser(u){S.users=S.users.filter(x=>x.u!=u);log('Usuario eliminado: '+u);render()}
function addType(){const n=$('#tn').value.trim();if(!n)return;S.types.push({n,s:$('#ts').value.split(',').map(x=>x.trim()).filter(Boolean)});log('Tipo agregado: '+n);render()}
function delType(i){log('Tipo eliminado: '+S.types[i].n);S.types.splice(i,1);render()}
function addSub(i){const v=$('#ns'+i).value.trim();if(v){S.types[i].s.push(v);save();render()}}
function delSub(i,j){S.types[i].s.splice(j,1);save();render()}
async function impKml(f){if(!f)return;let t;try{if(f.name.toLowerCase().endsWith('.kmz')){const z=await JSZip.loadAsync(f),k=Object.keys(z.files).find(n=>n.toLowerCase().endsWith('.kml'));t=await z.files[k].async('string')}else t=await f.text()}catch(e){return alert('No se pudo leer el archivo')}
const d=new DOMParser().parseFromString(t,'text/xml'),r=[];d.querySelectorAll('Placemark').forEach(p=>{const c=p.querySelector('Point coordinates');if(!c)return;const [lo,la]=c.textContent.trim().split(',').map(Number);r.push({n:p.querySelector('name')?.textContent||'Punto',lo,la})});
if(!r.length)return alert('No se encontraron puntos');const a=r.map(x=>x.lo),b=r.map(x=>x.la),x0=Math.min(...a),x1=Math.max(...a),y0=Math.min(...b),y1=Math.max(...b);
S.points=r.map(p=>({id:uid(),n:p.n,lat:p.la,lon:p.lo,x:Math.round(60+(x1==x0?.5:(p.lo-x0)/(x1-x0))*880),y:Math.round(540-(y1==y0?.5:(p.la-y0)/(y1-y0))*480)}));log(`Importados ${r.length} puntos desde ${f.name}`);render()}
function pdf(){const s=stats(),d=new jspdf.jsPDF();d.addImage(LOGO,'PNG',15,8,44,27);let y=44;const L=t=>{d.text(t,15,y);y+=8;if(y>280){d.addPage();y=20}};d.setFontSize(16);L('CONDOR - Informe de Emergencias para Jefatura');d.setFontSize(11);L(fmt(Date.now()));L(`Total: ${s.tot} | Activas: ${s.act} | Cierre promedio: ${s.avg} min | Unidades: ${s.ud}/${s.ut}`);y+=4;L('Por tipo:');Object.entries(s.tipo).forEach(([k,v])=>L(`  ${k}: ${v}`));L('Por prioridad:');Object.entries(s.pri).forEach(([k,v])=>L(`  ${k}: ${v}`));y+=4;L('Ultimas emergencias:');S.em.slice(0,15).forEach(e=>L(`#${e.n} ${e.type} - ${e.loc.n} - ${e.pri} - ${e.st}`.slice(0,90)));d.save('informe-emergencias.pdf')}
function ppt(){const s=stats(),p=new PptxGenJS();let a=p.addSlide();a.addImage({data:LOGO,x:.5,y:.2,w:2.9,h:1.78});a.addText('Informe de Emergencias',{x:.5,y:2.4,w:9,fontSize:36,bold:true});a.addText(fmt(Date.now()),{x:.5,y:3.4,fontSize:16});
a=p.addSlide();a.addText('KPI',{x:.5,y:.3,fontSize:28,bold:true});a.addText([`Emergencias totales: ${s.tot}`,`Activas: ${s.act}`,`Cierre promedio: ${s.avg} min`,`Unidades disponibles: ${s.ud}/${s.ut}`].map(t=>({text:t,options:{bullet:true,breakLine:true}})),{x:.5,y:1.2,w:9,fontSize:20});
a=p.addSlide();a.addText('Emergencias por tipo',{x:.5,y:.3,fontSize:28,bold:true});const k=Object.keys(s.tipo);if(k.length)a.addChart(p.charts.BAR,[{name:'Emergencias',labels:k,values:k.map(x=>s.tipo[x])}],{x:.5,y:1.2,w:9,h:4});
p.writeFile({fileName:'informe-emergencias.pptx'})}
