<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Emergencias - Centro de Monitoreo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen" class="overlay">
        <div class="login-box">
            <h2>Acceso Sistema CAD</h2>
            <input type="email" id="email" placeholder="Correo">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="login()">Ingresar</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <header>
            <div class="logo">CENTRO DE MONITOREO - LIVE</div>
            <div id="user-info"></div>
            <button onclick="logout()">Salir</button>
        </header>

        <main>
            <div id="sidebar">
                <h3>Material Mayor</h3>
                <div id="lista-vehiculos"></div>
                <hr>
                <div id="controles-operador" style="display:none;">
                    <h3>Despacho</h3>
                    <button onclick="abrirModalEmergencia()">Nueva Emergencia</button>
                </div>
            </div>
            <div id="map"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
