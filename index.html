<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Emergencias - Full Despacho</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div id="login-screen" class="overlay">
        <div class="login-box">
            <h2>CAD EMERGENCIAS</h2>
            <input type="email" id="email" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="login()">INGRESAR</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <header>
            <div class="brand"><strong>CAD</strong> | SISTEMA INTEGRAL</div>
            <div id="reloj-sistema" style="font-family: monospace; font-size: 1.2em;">00:00:00</div>
            <button class="btn-logout" onclick="logout()">Salir</button>
        </header>

        <div class="container">
            <aside id="sidebar">
                <div class="section-title">MATERIAL MAYOR</div>
                <div id="lista-vehiculos"></div>
            </aside>
            <div id="map"></div>
        </div>
        
        <button id="btn-nueva-emergencia" onclick="abrirModalEmergencia()">+</button>
    </div>

    <div id="modal-claves" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="titulo-unidad">UNIDAD</h3>
                <button onclick="cerrarModalClaves()" class="btn-close">&times;</button>
            </div>
            <div class="claves-grid" id="grid-claves">
                </div>
        </div>
    </div>

    <div id="modal-despacho-activo" class="modal-overlay" style="display:none;">
        <div class="modal-content large-modal">
            <div class="modal-header">
                <h2 id="despacho-titulo-tipo">INCENDIO FORESTAL</h2>
                <div id="cronometro-emergencia">00:00</div>
            </div>
            <div class="despacho-body">
                <div class="col">
                    <h4>UNIDADES SUGERIDAS (POR CERCANÍA)</h4>
                    <div id="unidades-cercanas"></div>
                </div>
                <div class="col">
                    <h4>UNIDADES DESPACHADAS</h4>
                    <div id="unidades-asignadas"></div>
                    <button onclick="finalizarEmergencia()" class="btn-finalizar">FINALIZAR SERVICIO</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-emergencia" class="modal-overlay transparent-bg" style="display:none;">
        <div class="modal-content float-form">
            <div class="modal-header">
                <h3>NUEVA EMERGENCIA</h3>
                <button onclick="cerrarModalEmergencia()" class="btn-close">&times;</button>
            </div>
            <div class="form-emergencia">
                <label>TIPO</label>
                <select id="em-tipo">
                    <option value="Incendio Forestal">Incendio Forestal</option>
                    <option value="Rescate Vehicular">Rescate Vehicular</option>
                    <option value="Amago equipos mineros">Amago equipos mineros</option>
                </select>
                <label>UBICACIÓN (Haz clic en mapa)</label>
                <input type="text" id="em-direccion" readonly>
                <button onclick="generarDespacho()" class="btn-despacho">GENERAR DESPACHO</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
