<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Emergencias - Monitoreo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div id="login-screen" class="overlay">
        <div class="login-box">
            <h2>CAD EMERGENCIAS</h2>
            <input type="email" id="email" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="login()">INGRESAR</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <header>
            <div class="brand"><strong>CENTRO DE MONITOREO</strong> | CAD</div>
            <div class="header-controls">
                <button id="theme-toggle" onclick="toggleTheme()">Modo Claro</button>
                <div id="user-display"></div>
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>
        <div class="container">
            <aside id="sidebar">
                <div class="section-title">MATERIAL MAYOR</div>
                <div id="lista-vehiculos"></div>
            </aside>
            <div id="map"></div>
        </div>
    </div>

    <div id="modal-claves" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-titulo">Estado Unidad</h3>
                <button onclick="cerrarModal()" class="btn-close">&times;</button>
            </div>
            
            <div id="view-claves" class="claves-grid"></div>

            <div id="view-bases" style="display:none;">
                <p style="margin-bottom:10px; font-size:12px; color:#888; text-transform:uppercase;">Seleccione Base de Destino:</p>
                <div class="claves-grid" id="bases-container"></div>
                <button onclick="mostrarClavesPrincipales()" class="btn-back">VOLVER</button>
            </div>

            <div id="view-tramite" style="display:none;">
                <p style="margin-bottom:10px; font-size:12px; color:#888; text-transform:uppercase;">Especifique el Trámite:</p>
                <input type="text" id="input-613" placeholder="Ej: Mantención, Reunión, etc." 
                       style="width:100%; padding:12px; background:#222; border:1px solid #444; color:#fff; border-radius:6px; margin-bottom:15px; box-sizing: border-box;">
                <button onclick="guardarTramite()" class="btn-clave" style="width:100%; text-align:center; background: #ff4500; color: white;">ACTUALIZAR ESTADO</button>
                <button onclick="mostrarClavesPrincipales()" class="btn-back">VOLVER</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
