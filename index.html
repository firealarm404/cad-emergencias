<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Emergencias - Centro de Monitoreo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <div id="login-screen" class="overlay">
        <div class="login-box">
            <h2>CAD EMERGENCIAS</h2>
            <input type="email" id="email" placeholder="Correo electrónico">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="login()">INGRESAR</button>
        </div>
    </div>

    <div id="main-app" style="display:none;">
        <header>
            <div class="brand"><strong>CENTRO DE MONITOREO</strong> | CAD</div>
            <div class="header-controls">
                <button id="theme-toggle" onclick="toggleTheme()">Modo Claro</button>
                <div id="user-display"></div>
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>

        <div class="container">
            <aside id="sidebar">
                <div class="section-title">MATERIAL MAYOR</div>
                <div id="lista-vehiculos"></div>
                
                <div id="controles-operador" style="display:none; margin-top: 20px;">
                    <div class="section-title">ACCIONES</div>
                    <button class="btn-emergency">NUEVA EMERGENCIA</button>
                </div>
            </aside>
            
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
